<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">NoticeKit social preview</title>
  <desc id="desc">NoticeKit brand preview for subprocessor change notices.</desc>
  <rect width="1200" height="630" fill="#080b0f"/>
  <rect x="54" y="54" width="1092" height="522" rx="32" fill="#101720" stroke="#263442" stroke-width="2"/>
